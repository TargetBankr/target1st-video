name: Queue series builds

# Builds the videos of the days you choose, from files already made by "Make series videos" (series/ready/).
# Example: days "1-2" builds gd01, ssc01, gd02, ssc02 one after another. Run it once a day (or whenever you want more).
# Nothing is built unless you run this. Missing files are skipped with a warning.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to build, e.g. 3-4 or 5 (day N = gdNN + sscNN)"
        default: "1"

permissions:
  contents: read
  actions: write

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Queue the builds
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/days.txt"
          import os, re
          out = []
          for part in re.split(r"[,\s]+", os.environ["DAYS"].strip()):
              if not part: continue
              m = re.fullmatch(r"(\d+)-(\d+)", part)
              out += range(int(m.group(1)), int(m.group(2)) + 1) if m else [int(part)]
          print(" ".join(str(d) for d in out))
          PY
          n=0
          for d in $(cat "$RUNNER_TEMP/days.txt"); do
            for e in gd ssc; do
              f=$(printf "series/ready/%s%02d.json" "$e" "$d")
              if [ -f "$f" ]; then
                echo "Queue: $f"
                gh workflow run video.yml --ref "$GITHUB_REF_NAME" -f "file=$f" -f "delay=after" < /dev/null
                n=$((n+1)); sleep 5
              else
                echo "::warning::$f does not exist yet (run Make series videos first)"
              fi
            done
          done
          echo "Queued $n video(s)."
