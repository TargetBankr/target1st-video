name: Build quiz video

# Voice: Edge-TTS (free, unlimited), Gemini AI voice (natural, free tier is slow/limited) or Sarvam Bulbul
# (natural Hindi, Rs 100 free credits on signup, then paid).
# Gemini needs a repository secret named GEMINI_API_KEY, Sarvam needs SARVAM_API_KEY
# (Settings > Secrets and variables > Actions > Repository secrets).
# Choose it with the "tts" input below, or set "tts" in the JSON meta (input "auto" = use the JSON).
# Gemini/Sarvam voice lines are cached between runs, so a stopped build continues on re-run without paying twice.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "JSON file to render"
        default: "questions.json"
      limit:
        description: "Only first N questions (0 = all)"
        default: "0"
      theme:
        description: "Colours and font"
        type: choice
        default: "auto"
        options: [auto, classic, night, royal]
      layout:
        description: "Options on question slide"
        type: choice
        default: "auto"
        options: [auto, list, grid]
      format:
        description: "quiz = options + countdown, revision = answer straight away"
        type: choice
        default: "auto"
        options: [auto, quiz, revision]
      tts:
        description: "Voice engine: edge = Edge-TTS, gemini = Gemini (GEMINI_API_KEY), sarvam = Sarvam Bulbul (SARVAM_API_KEY)"
        type: choice
        default: "auto"
        options: [auto, edge, gemini, sarvam]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Slow installs are usually a slow apt mirror or the Chromium download. So: each attempt gets a time limit and
      # is retried automatically (no manual cancel), and the runner's own Google Chrome is used when present, which
      # skips the big Chromium download completely (build.py falls back to Playwright's Chromium if Chrome is missing).
      - name: Install tools
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            if timeout 150 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-core fonts-freefont-ttf'; then
              break
            fi
            echo "apt attempt $i failed or timed out, retrying"; sleep 5
          done
          command -v ffmpeg >/dev/null || { echo "ffmpeg install failed"; exit 1; }
          pip install edge-tts playwright
          if command -v google-chrome >/dev/null; then
            echo "Using the runner's Google Chrome"
          else
            for i in 1 2 3; do
              timeout 240 playwright install --with-deps chromium && break
              echo "playwright attempt $i failed or timed out, retrying"; sleep 5
            done
          fi

      # Gemini/Sarvam voice lines already made (keeps progress if a limit or error stops a run)
      - name: Restore voice cache
        uses: actions/cache/restore@v4
        with:
          path: output/work/audio
          key: voice-cache-${{ github.run_id }}
          restore-keys: |
            voice-cache-

      - name: Build video
        env:
          FILE: ${{ inputs.file }}
          LIMIT: ${{ inputs.limit }}
          THEME: ${{ inputs.theme }}
          LAYOUT: ${{ inputs.layout }}
          FORMAT: ${{ inputs.format }}
          TTS: ${{ inputs.tts }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python -u build.py "$FILE" --out output --limit "$LIMIT" --theme "$THEME" --layout "$LAYOUT" --format "$FORMAT" --tts "$TTS"

      - name: Save voice cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/work/audio
          key: voice-cache-${{ github.run_id }}

      - name: Publish release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
        run: |
          gh release create "video-$RUN_NO" output/video.mp4 output/description.txt \
            --title "Video $RUN_NO" \
            --notes "Download video.mp4 and upload it to YouTube. description.txt has title and chapters."
