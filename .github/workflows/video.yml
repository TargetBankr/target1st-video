name: Build quiz video

# Voice: Edge-TTS (free, unlimited) or Gemini AI voice (more natural, free tier is rate limited).
# Gemini needs a repository secret named GEMINI_API_KEY (Settings > Secrets and variables > Actions).
# Choose it with the "tts" input below, or set "tts": "gemini" in the JSON meta (input "auto" = use the JSON).
# Gemini voice lines are cached between runs, so a build stopped by the daily free limit continues on re-run.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "JSON file to render"
        default: "questions.json"
      limit:
        description: "Only first N questions (0 = all)"
        default: "0"
      theme:
        description: "Colours and font"
        type: choice
        default: "auto"
        options: [auto, classic, night, royal]
      layout:
        description: "Options on question slide"
        type: choice
        default: "auto"
        options: [auto, list, grid]
      format:
        description: "quiz = options + countdown, revision = answer straight away"
        type: choice
        default: "auto"
        options: [auto, quiz, revision]
      tts:
        description: "Voice engine: edge = Edge-TTS, gemini = Gemini AI voice (needs GEMINI_API_KEY secret)"
        type: choice
        default: "auto"
        options: [auto, edge, gemini]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-freefont-ttf
          pip install edge-tts playwright
          playwright install --with-deps chromium

      # Gemini voice lines already made (keeps progress if the free daily limit stops a run)
      - name: Restore voice cache
        uses: actions/cache/restore@v4
        with:
          path: output/work/audio
          key: voice-cache-${{ github.run_id }}
          restore-keys: |
            voice-cache-

      - name: Build video
        env:
          FILE: ${{ inputs.file }}
          LIMIT: ${{ inputs.limit }}
          THEME: ${{ inputs.theme }}
          LAYOUT: ${{ inputs.layout }}
          FORMAT: ${{ inputs.format }}
          TTS: ${{ inputs.tts }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build.py "$FILE" --out output --limit "$LIMIT" --theme "$THEME" --layout "$LAYOUT" --format "$FORMAT" --tts "$TTS"

      - name: Save voice cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/work/audio
          key: voice-cache-${{ github.run_id }}

      - name: Publish release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
        run: |
          gh release create "video-$RUN_NO" output/video.mp4 output/description.txt \
            --title "Video $RUN_NO" \
            --notes "Download video.mp4 and upload it to YouTube. description.txt has title and chapters."
