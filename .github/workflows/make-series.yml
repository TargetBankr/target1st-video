name: "1A · Make JSON with Gemini (series: HSSC Group D + SSC)"

# Makes the 50-question JSONs from series/plan.json with Gemini, saves them in series/ready/, and (if you want) builds them.
# Day N = gdNN (HSSC Group D) + sscNN (SSC), so days "1-3" = 6 videos, built in upload order: gd01, ssc01, gd02, ssc02 ...
#
# From your phone: Actions > 1A · Make JSON with Gemini (series) > Run workflow
#   days  "1-6" or "3,5,8"
#   mode  make + build  = make the JSONs that do not exist yet, then build them one after another
#         make only     = only the JSONs (no voice quota used)
#         build only    = build JSONs that were made earlier (missing ones are skipped)
#   force true = make a set again even if its file already exists
#
# Every question is fact-checked with Google Search (wrong/unconfirmed ones are dropped and replaced): about 10-15 min per set,
# so make about 5 days (10 sets) per run. Files per set in series/ready/: <id>.json, <id>.title.txt (title + description),
# <id>.check.txt (spot-check list). Reels/stories: set "auto_reels": true in series/base_meta.json (off by default).
# Keys: GEMINI_API_KEY and GEMINI_API_KEY_2 ... _5 (whichever exist).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to make, e.g. 1-6 or 3,5,8 (day N = gdNN + sscNN)"
        default: "1-3"
      mode:
        description: "make + build / make only / build only (files made earlier)"
        type: choice
        default: "make + build"
        options: ["make + build", "make only", "build only"]
      force:
        description: "true = remake sets whose file already exists"
        type: choice
        default: "false"
        options: ["false", "true"]

permissions:
  contents: write
  actions: write

concurrency:
  group: make-series
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make the JSON files
        if: inputs.mode != 'build only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          DAYS: ${{ inputs.days }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--days "$DAYS" --made-list "$RUNNER_TEMP/made.txt")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -u tools/make_series.py "${args[@]}"

      - name: Save the files
        if: inputs.mode != 'build only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/ready/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Series: ${{ inputs.days }}"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Queue the video builds
        if: inputs.mode != 'make only'
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "build only" ]; then
            # every day in the range, gd first then ssc, only files that exist
            python3 - > "$RUNNER_TEMP/made.txt" <<'PY2'
          import os, re
          for part in re.split(r"[,\s]+", os.environ["DAYS"].strip()):
              if not part: continue
              m = re.fullmatch(r"(\d+)-(\d+)", part)
              for d in (range(int(m.group(1)), int(m.group(2)) + 1) if m else [int(part)]):
                  for e in ("gd", "ssc"):
                      f = f"series/ready/{e}{d:02d}.json"
                      if os.path.exists(f): print(f)
                      else: print(f"::warning::{f} does not exist yet (make it first)", file=__import__("sys").stderr)
          PY2
          fi
          if [ ! -s "$RUNNER_TEMP/made.txt" ]; then echo "Nothing to build."; exit 0; fi
          while read -r f; do
            [ -z "$f" ] && continue
            echo "Queue: $f"
            gh workflow run video.yml --ref "$GITHUB_REF_NAME" -f "file=$f" -f "delay=after" < /dev/null
            sleep 5
          done < "$RUNNER_TEMP/made.txt"
